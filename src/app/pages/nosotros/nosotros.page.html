<ion-header>
  <ion-toolbar>
    <ion-title>Nosotros</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <ion-card>
    <ion-card-header>
      <ion-card-title>Nuestra empresa</ion-card-title>
    </ion-card-header>

    <ion-card-content>
      Empresa especializada en soluciones basadas en Angular, Ionic y Node.js.

      @if (distancia !== null) {
        <p style="margin-top: 12px;">
          📍 Distancia a nuestras oficinas:
          <strong>{{ distancia }} km</strong>
        </p>
      }
    </ion-card-content>
  </ion-card>

  <ion-button expand="block" (click)="obtenerPosicion()" [disabled]="cargando">
    @if (cargando) {
      <ion-spinner name="crescent"></ion-spinner>
      &nbsp;Obteniendo ubicación...
    } @else {
      Obtener mi posición
    }
  </ion-button>

  @if (error) {
    <div style="color: red; margin-top: 10px; text-align: center;">
      ⚠️ {{ error }}
    </div>
  }

</ion-content>
